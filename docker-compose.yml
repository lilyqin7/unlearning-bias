services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      INFERENCE_API_URL: http://inference:8000
      INFERENCE_API_KEY: ${INFERENCE_API_KEY:?Set INFERENCE_API_KEY in .env.docker}
      LORA_WEIGHTS_URL: ${LORA_WEIGHTS_URL:?Set LORA_WEIGHTS_URL in .env.docker}
    ports:
      - "3000:3000"
    depends_on:
      inference:
        condition: service_healthy
    restart: unless-stopped

  inference:
    build:
      context: .
      dockerfile: self-hosted-inference/Dockerfile
    environment:
      HF_HOME: /models/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
      INFERENCE_API_KEY: ${INFERENCE_API_KEY:?Set INFERENCE_API_KEY in .env.docker}
      SDXL_MODEL_ID: ${SDXL_MODEL_ID:-stabilityai/stable-diffusion-xl-base-1.0}
    expose:
      - "8000"
    volumes:
      - hf-cache:/models/huggingface
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  hf-cache:
